<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Alexey (Oleksii) Omelchuk</title>
  <link rel="stylesheet" href="styles.css">

 <style>
  /* PORTFOLIO PAGE */

  .portfolio-page {
    padding: 60px 30px 100px;
  }

  .portfolio-inner {
    max-width: 1600px;
    margin: 0 auto;
  }

  .portfolio-page h1 {
    margin: 0 0 42px;
    font-size: clamp(30px, 4vw, 56px);
    line-height: 1;
    font-weight: 500;
  }

  /* 4 REELS */

  .portfolio-reels {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
  }

  .portfolio-reel {
    min-width: 0;
  }

  .portfolio-reel__video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }

  .portfolio-reel__video iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .portfolio-reel h2 {
    margin: 15px 0 0;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.3;
    text-transform: uppercase;
  }

  /* COLLECTIONS */

  .portfolio-collections {
    margin-top: 80px;
    padding-top: 35px;
    border-top: 1px solid rgba(255, 255, 255, 0.18);
  }

  .portfolio-collections__label {
    margin: 0 0 25px;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .portfolio-collections__grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
  }

  .portfolio-collection {
    position: relative;
    display: block;
    min-height: 330px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    text-decoration: none;
    background: #111;
  }

  .portfolio-collection img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.55;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }

  .portfolio-collection::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(0, 0, 0, 0.88) 0%,
      rgba(0, 0, 0, 0.18) 70%
    );
  }

  .portfolio-collection__content {
    position: absolute;
    z-index: 2;
    left: 28px;
    right: 28px;
    bottom: 26px;
  }

  .portfolio-collection h2 {
    margin: 0 0 8px;
    font-size: clamp(22px, 2vw, 32px);
    font-weight: 400;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .portfolio-collection p {
    margin: 0;
    color: rgba(255, 255, 255, 0.72);
    font-size: 13px;
  }

  .portfolio-collection:hover img {
    transform: scale(1.025);
    opacity: 0.72;
  }

  /* RESPONSIVE */

  @media (max-width: 1100px) {
    .portfolio-reels {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 700px) {
    .portfolio-page {
      padding: 45px 18px 70px;
    }

    .portfolio-reels,
    .portfolio-collections__grid {
      grid-template-columns: 1fr;
    }

    .portfolio-collection {
      min-height: 260px;
    }

    .portfolio-collections {
      margin-top: 60px;
    }
  }
</style>
</head>

<body>

<header class="site-header">
  <div class="identity">

    <p>COMPOSER | AUDIO LEAD | SOUND DESIGNER</p>

  <nav class="main-nav">

  </div>
</main>

</body>
</html>
